services:

  python-service:
    image: n4ssim11/energia:${API_IMAGE_TAG:-api-latest}
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000

  gateway:
    image: n4ssim11/energia:${GATEWAY_IMAGE_TAG:-gateway-latest}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000

  langage:
    image: ollama/ollama:0.9.2
    container_name: energia_ollama
    ports:
      - "11434:11434"

    volumes:
      - ./ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
# modèle chargement : docker exec -it energia_ollama ollama pull qwen2.5:7b

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8002
    ports:
      - "8002:8002"
    container_name: energia-mcp 
    env_file:
      - ./mcp_server/.env
    restart: unless-stopped
